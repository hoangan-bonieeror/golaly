# Local PostgreSQL for development:   docker compose up -d db
# Full stack in containers (optional): docker compose --profile full up --build   → http://localhost:3000
# Place catalog pipeline (optional):    docker compose --profile pipelines up -d --build → Airflow on http://localhost:8080
services:
  db:
    # PostgreSQL 16 + PostGIS (the place catalog stores points and province boundaries).
    # Same data directory format as postgres:16-alpine, so an existing volume keeps working.
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: triply
      POSTGRES_PASSWORD: triply
      POSTGRES_DB: triply
    ports:
      # Host port is configurable (e.g. TRIPLY_DB_PORT=5433 in a .env next to this file
      # when another PostgreSQL already uses 5432). Update DATABASE_URL to match.
      # Bound to localhost only: the demo credentials must never be reachable from the network.
      - "127.0.0.1:${TRIPLY_DB_PORT:-5432}:5432"
    volumes:
      - triply-db:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triply -d triply"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies migrations once, then exits; the API starts only after it succeeds.
  migrate:
    profiles: ["full"]
    build: { context: ., dockerfile: apps/api/Dockerfile, target: migrate }
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://triply:triply@db:5432/triply

  api:
    profiles: ["full"]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://triply:triply@db:5432/triply
      # Only used by the optional "full" profile. The API refuses to start if this is empty or too short.
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # This compose stack serves plain HTTP on localhost; set COOKIE_SECURE=true behind HTTPS instead.
      ALLOW_INSECURE_COOKIES: ${ALLOW_INSECURE_COOKIES:-1}
      # The web container reaches the API over the Docker network (a private address).
      TRUST_PROXY: "loopback, uniquelocal"
      MEDIA_DIR: /data/media
      # Needed to download imported place photos from Wikimedia (see pipelines/README.md).
      CATALOG_CONTACT: ${CATALOG_CONTACT:-}
    volumes:
      - triply-media:/data/media
    # Not published: browsers reach it only through the edge (REST via web, Socket.IO via nginx).

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_ORIGIN: http://api:4000
        # Realtime goes through the edge on the same origin.
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-http://localhost:3000}
    depends_on: [api]

  # The only published port. Overwrites X-Forwarded-For with the real client IP (deploy/nginx.conf).
  edge:
    profiles: ["full"]
    image: nginx:1.27-alpine
    depends_on: [web, api]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:3000"

  # ── Place catalog (pipelines/README.md) ──────────────────────────────────────────────
  # Airflow keeps its own metadata in a separate "airflow" database on the same server.
  airflow-db:
    profiles: ["pipelines"]
    image: postgis/postgis:16-3.4-alpine
    depends_on:
      db: { condition: service_healthy }
    environment: { PGPASSWORD: triply }
    entrypoint: ["sh", "-c"]
    command:
      - psql -h db -U triply -d triply -tAc "SELECT 1 FROM pg_database WHERE datname = 'airflow'" | grep -q 1
        || psql -h db -U triply -d triply -c "CREATE DATABASE airflow"
    restart: "no"

  airflow:
    profiles: ["pipelines"]
    build: { context: ., dockerfile: pipelines/Dockerfile }
    command: standalone
    depends_on:
      airflow-db: { condition: service_completed_successfully }
    environment: &catalog-env
      DATABASE_URL: postgresql://triply:triply@db:5432/triply
      # The package is also mounted from ./pipelines (below) and put first on the path, so code changes
      # apply without rebuilding the image. Rebuild only when pyproject.toml dependencies change.
      PYTHONPATH: /opt/triply/src
      CATALOG_CONTACT: ${CATALOG_CONTACT:-}
      OVERTURE_RELEASE: ${OVERTURE_RELEASE:-}
      HF_TOKEN: ${HF_TOKEN:-}
      FSQ_RELEASE: ${FSQ_RELEASE:-}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://triply:triply@db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      # Local development only: everyone is admin, no login. Never expose this port publicly.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    volumes:
      - ./pipelines/dags:/opt/airflow/dags:ro
      - ./pipelines/triply_catalog:/opt/triply/src/triply_catalog:ro
      - triply-catalog:/data/catalog
    ports:
      - "127.0.0.1:8080:8080"

  # One-off CLI:  docker compose --profile pipelines run --rm catalog sync --area hoi-an
  catalog:
    profiles: ["pipelines"]
    build: { context: ., dockerfile: pipelines/Dockerfile }
    entrypoint: ["triply-catalog"]
    command: ["stats"]
    depends_on:
      db: { condition: service_healthy }
    environment: *catalog-env
    volumes:
      - ./pipelines/triply_catalog:/opt/triply/src/triply_catalog:ro
      - triply-catalog:/data/catalog

volumes:
  triply-db:
  triply-media:
  triply-catalog:
