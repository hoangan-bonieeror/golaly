# Edge proxy for the Docker "full" profile — the only container exposed to the host.
#
# Why it exists: per-IP rate limits are only as good as the client IP the API sees. nginx is the
# first hop, so it can OVERWRITE X-Forwarded-For with the real peer address; nothing a client
# sends in that header survives. (Next.js on its own would pass a forged header straight through.)
# It also serves Socket.IO on the same origin, so the API port never has to be published.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 3000;
  client_max_body_size 10m;

  # Same for every location: the client's own X-Forwarded-For / X-Real-IP are discarded.
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header Host              $host;

  # Realtime → API directly (WebSocket upgrade).
  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # Everything else → the Next.js web app (which proxies /api/v1 and /media to the API).
  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
  }
}
