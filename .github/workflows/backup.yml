name: Backup

# Nightly logical backup of the production database (security review S23). Neon's free plan only keeps 6 hours of
# history, so a bad migration or a mistaken delete noticed the next day couldn't be undone without this.
#
# The dump is encrypted (AES-256, gpg symmetric) with the BACKUP_PASSPHRASE secret before it leaves the runner:
# artifacts of a public repository can be downloaded by any signed-in GitHub user. Kept 14 days.
# Restore: docs/CI-CD.md → "Restore a backup".
on:
  schedule:
    - cron: "41 3 * * *" # 03:41 UTC daily (after the analytics build)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-production
  cancel-in-progress: false

jobs:
  dump:
    name: pg_dump → encrypted artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          for v in DATABASE_URL BACKUP_PASSPHRASE; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is not set (see docs/CI-CD.md)"; exit 1; fi
          done
          if [ "${#BACKUP_PASSPHRASE}" -lt 32 ]; then echo "::error::BACKUP_PASSPHRASE must be at least 32 characters"; exit 1; fi
      - name: Dump (custom format; pg_dump 18 reads any older server)
        run: |
          docker run --rm -e DATABASE_URL postgres:18-alpine \
            sh -c 'pg_dump --format=custom --compress=9 --no-owner --no-privileges "$DATABASE_URL"' > golaly.dump
          # A dump that pg_restore can't list is not a backup.
          docker run --rm -i postgres:18-alpine pg_restore --list < golaly.dump > toc.txt
          tables=$(grep -c ' TABLE DATA ' toc.txt || true)
          echo "Dump: $(du -h golaly.dump | cut -f1), $tables tables" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$tables" -gt 10 ] || { echo "::error::Dump looks empty"; exit 1; }
      - name: Encrypt
        run: |
          name="golaly-$(date -u +%Y%m%dT%H%MZ).dump.gpg"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output "$name" golaly.dump 3<<<"$BACKUP_PASSPHRASE"
          shred -u golaly.dump toc.txt
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
