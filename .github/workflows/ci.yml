# TRIPLY — CI/CD
#
#   pull_request / push to any branch → CI: lint + typecheck, API tests (PostGIS), build (+ API Docker image), pipelines (pytest)
#   push to main, CI green           → CD: Neon migrations → Render (API) → Vercel (web) → smoke test
#
# The Playwright Definition-of-Done E2E run lives in e2e.yml (manual: Actions → E2E → Run workflow).
# Setup (secrets, Render/Vercel settings): docs/CI-CD.md

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after the checks (only on main)"
        type: boolean
        default: true

permissions:
  contents: read

# A newer push to the same PR/branch cancels the checks still running for the old one.
# Deploy jobs have their own non-cancelling group (see below), so a deploy is never cut in half.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1
  # Tests and builds never talk to Neon / Render / Vercel.
  JWT_SECRET: ci-only-secret-ci-only-secret-0123456789
  WEB_ORIGIN: http://localhost:3000
  API_ORIGIN: http://localhost:4000
  NEXT_PUBLIC_REALTIME_URL: http://localhost:4000
  NEXT_PUBLIC_DEMO_SWITCHER: "false"

jobs:
  # ─────────────────────────────────────────────── CI ───────────────────────────────────────────────
  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci # postinstall builds @triply/shared and generates the Prisma client
      - run: npm run lint
      - run: npm run typecheck

  api-tests:
    name: API tests (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: triply
          POSTGRES_PASSWORD: triply
          POSTGRES_DB: triply
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triply" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://triply:triply@localhost:5432/triply
      # Rebuilt from the migrations and seeded by test/global-setup.ts
      TEST_DATABASE_URL: postgresql://triply:triply@localhost:5432/triply_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Create test database
        run: PGPASSWORD=triply psql -h localhost -U triply -c "CREATE DATABASE triply_test;"
      # Same command CD runs against Neon — a migration that fails here never reaches production.
      - name: prisma migrate deploy on an empty database
        run: npm run db:deploy
      - name: Jest (unit + integration)
        run: npm test

  build:
    name: Build (shared, API, web) + API image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      # The same Dockerfile Render builds — a broken image fails here, before anything is deployed.
      - uses: docker/setup-buildx-action@v3
      - name: Build API Docker image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  pipelines:
    name: Pipelines (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: triply
          POSTGRES_PASSWORD: triply
          POSTGRES_DB: triply
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triply" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://triply:triply@localhost:5432/triply_catalog_test
    defaults:
      run:
        working-directory: pipelines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # the integration tests load the app's demo seed (prisma/seed.ts)
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -v

  # ─────────────────────────────────────────────── CD ───────────────────────────────────────────────
  # Runs only for main (push, or a manual run with deploy=true) after every CI job is green.
  # Order matters: the database schema first, then the API that needs it, then the web that calls the API.
  migrate:
    name: "Deploy 1/3 · Neon migrations"
    needs: [lint, api-tests, build, pipelines]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install API toolchain only
        run: npm ci --workspace @triply/api --workspace @triply/shared --include-workspace-root --ignore-scripts
      - name: prisma migrate deploy → Neon (production branch)
        env:
          # Neon DIRECT endpoint (host without "-pooler"), ?sslmode=require
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        working-directory: apps/api
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Secret NEON_DATABASE_URL is not set (see docs/CI-CD.md)"; exit 1; fi
          case "$DATABASE_URL" in *-pooler.*) echo "::error::Use Neon's DIRECT endpoint, not -pooler"; exit 1;; esac
          npx prisma migrate status || true   # informative: lists pending migrations
          npx prisma migrate deploy

  deploy-api:
    name: "Deploy 2/3 · API → Render"
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.API_URL }}
    concurrency:
      group: deploy-production-api
      cancel-in-progress: false
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Trigger Render deploy of this commit
        id: hook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set (see docs/CI-CD.md)"; exit 1; fi
          # ref= pins the deploy to the commit CI just tested (not whatever is on main by now).
          res=$(curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}")
          echo "$res"
          echo "deploy_id=$(echo "$res" | jq -r '.deploy.id // empty')" >> "$GITHUB_OUTPUT"
      - name: Wait until the deploy is live
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != '' && steps.hook.outputs.deploy_id != ''
        env:
          DEPLOY_ID: ${{ steps.hook.outputs.deploy_id }}
        run: |
          # Free instances build slowly; give it up to ~25 minutes.
          for i in $(seq 1 100); do
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" | jq -r '.status')
            echo "[$i] $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy $DEPLOY_ID ended with status $status"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for Render deploy $DEPLOY_ID"; exit 1
      - name: Health check
        if: env.API_URL != ''
        run: |
          # A sleeping Free instance can take ~1 minute to wake.
          for i in $(seq 1 20); do
            if curl -fsS --max-time 20 "$API_URL/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::$API_URL/health did not answer"; exit 1

  deploy-web:
    name: "Deploy 3/3 · Web → Vercel"
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-production-web
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Check secrets
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set (see docs/CI-CD.md)"; exit 1; fi
          done
      - run: npm install --global vercel@latest
      # Production env vars (API_ORIGIN, NEXT_PUBLIC_REALTIME_URL, …) come from the Vercel project settings.
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          url="${WEB_URL:-${{ steps.deploy.outputs.url }}}"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url/welcome")
            echo "[$i] $url/welcome → $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::error::$url/welcome did not return 200"; exit 1
