[project]
name = "golaly-catalog"
version = "0.1.0"
description = "Golaly place catalog pipeline: imports open place data (Overture Maps, OpenStreetMap) into the app database."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.5,<2",
  "psycopg[binary]>=3.2,<4",
  "osmium>=4.0,<5",
  "phonenumbers>=8.13",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
golaly-catalog = "golaly_catalog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["golaly_catalog"]

[tool.pytest.ini_options]
markers = ["integration: needs PostgreSQL with PostGIS and Node.js"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E731"]
"tests/fixtures/make_fixtures.py" = ["E501"]
"tests/test_pipeline_photos.py" = ["E501"]
